# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Claude Code (Anthropic)
description: Anthropic Claude Code CLI as a sandbox workload
author: Jared Davis

sourceUrl: https://github.com/anthropics/claude-code

kind: workload
provides:
  - claude-code@2.1.312
  - bash@5
  - codebase-memory-mcp@0.12.1
  - curl@8
  - git@2
  - jq@1
  - node@26.13
  - pnpm@12.15.0
  - prek@0.5.7
  - ripgrep@15
  - python@3.14
  - typescript@7.0.2
  - uv@0.13.6
dockerfile: anthropic.dockerfile
args:
  registry:
    default: ghcr.io/jared-prime
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    description: registry namespace for the base kit
    buildArg: registry
  version:
    default: "2.2.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: base kit version
    buildArg: version
  model:
    default: "claude-sonnet-5-5"
    description: Claude model ID or alias, e.g. claude-fable-5-1, sonnet, opus[1m]
    pattern: '^[a-z0-9.-]+(\[1m\])?$'
    env: ANTHROPIC_MODEL
  effort:
    default: "medium"
    description: Claude reasoning effort level
    pattern: '^(low|medium|high|xhigh|max)$'
    env: CLAUDE_CODE_EFFORT_LEVEL

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - hosts:
              - api.anthropic.com
              - claude.ai
              - platform.claude.com
              - api.githubcopilot.com
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - GET
              - HEAD

        deny:
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE
          - hosts:
              - api.github.com
            methods:
              - POST
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - POST
            paths:
              - "/**/git-receive-pack"

  - type: com.docker.sandbox/credential@1
    description: Credentials policy for the GitHub MCP server
    optional: true
    config:
      service: github
      phase: [runtime]
      apiKey:
        name: GITHUB_PAT_TOKEN
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  # Declaring both apiKey and oauth means "whichever the host has bound".
  # No proxyManaged: it would plant ANTHROPIC_API_KEY even when nothing is
  # bound, falsely signalling key auth. The proxy intercepts the token
  # exchange from /login, so the real token stays on the host and later
  # sandboxes start signed in.
  - type: com.docker.sandbox/credential@1
    description: Anthropic access (API key or claude.ai OAuth)
    optional: true
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
      oauth:
        tokenEndpoint:
          host: platform.claude.com
          path: /v1/oauth/token
        resourceHosts:
          - api.anthropic.com
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          path: ~/.claude/.credentials.json
          structure:
            claudeAiOauth:
              accessToken: "{{.AccessToken}}"
              refreshToken: "{{.RefreshToken}}"
              expiresAt: "{{.ExpiresAt}}"
              scopes: "{{.Scopes}}"
            primaryApiKey: "{{.PrimaryApiKey}}"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command:
            - /usr/local/bin/authorization.sh
          user: agent
          env:
            - SBX_CRED_ANTHROPIC_MODE
          description: Seed Claude Code auth mode from the host credential binding

  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.claude/skills

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: anthropic.context.md
