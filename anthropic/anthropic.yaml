# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Claude Code (Anthropic)
description: Anthropic Claude Code CLI as a sandbox workload
author: Jared Davis

sourceUrl: https://github.com/anthropics/claude-code

kind: workload
provides: ["claude-code@2.1.312"]
dockerfile: anthropic.dockerfile
args:
  model:
    default: "claude-sonnet-5-5"
    description: Claude model ID or alias, e.g. claude-fable-5-1, sonnet, opus[1m]
    pattern: '^[a-z0-9.-]+(\[1m\])?$'
    env: ANTHROPIC_MODEL
  effort:
    default: "medium"
    description: Claude reasoning effort level
    pattern: '^(low|medium|high|xhigh|max)$'
    env: CLAUDE_CODE_EFFORT_LEVEL

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - hosts:
              - api.anthropic.com
              - claude.ai
              - platform.claude.com
              - api.githubcopilot.com
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - GET
              - HEAD

        deny:
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE

  - type: com.docker.sandbox/credential@1
    description: Credentials policy for the GitHub MCP server
    optional: true
    config:
      service: github
      phase: [runtime]
      apiKey:
        name: GITHUB_PAT_TOKEN
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.claude/skills

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: anthropic.context.md
