# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Anomaly
description: Anomaly `opencode` as a sandbox workload preconfigured for LM Studio
author: Jared Davis

kind: workload
provides:
  - opencode@2.2.5
  - bash@5
  - codebase-memory-mcp@0.12.1
  - curl@8
  - git@2
  - jq@1
  - node@26.13
  - pnpm@12.16.1
  - prek@0.5.10
  - ripgrep@15
  - python@3.15
  - typescript@7.0.2
  - uv@0.13.7
dockerfile: anomaly.dockerfile
args:
  tools:
    default: ghcr.io/jared-prime/kit:latest
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    description: registry namespace for the base kit
    buildArg: tools

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@2
    optional: false
    config:
      runtime:
        allow:
          - hosts:
              - api.githubcopilot.com

  - type: com.docker.sandbox/credential@1
    description: Credentials policy for the GitHub MCP server
    optional: true
    config:
      service: github
      phase: [runtime]
      apiKey:
        name: GITHUB_PAT_TOKEN
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/agent-sessions@1
    config:
      resume: ["-s", "{{.SessionID}}"]
      continue: ["-c"]
      list: "opencode session list --format json | jq -r '.[].id'"

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: anomaly.context.md
