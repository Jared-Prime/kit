# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Anomaly
description: Anomaly `opencode` as a sandbox workload preconfigured for LM Studio
author: Jared Davis

kind: workload
provides:
  - opencode@2.0.32
  - bash@5
  - codebase-memory-mcp@0.12.1
  - git@2
  - jq@1
  - node@26.12
  - pnpm@12.15.0
  - prek@0.5.7
  - python@3.14
  - typescript@7.0.2
  - uv@0.13.6
dockerfile: anomaly.dockerfile
capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - hosts:
              - opencode.ai
              # LM Studio — policy matches against localhost:<port> even though
              # the agent connects via host.docker.internal:<port>
              - localhost:1234
              - api.githubcopilot.com
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - GET
              - HEAD

        deny:
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE
          - hosts:
              - api.github.com
            methods:
              - POST
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - POST
            paths:
              - "/**/git-receive-pack"

  - type: com.docker.sandbox/credential@1
    description: Credentials policy for the GitHub MCP server
    optional: true
    config:
      service: github
      phase: [runtime]
      apiKey:
        name: GITHUB_PAT_TOKEN
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/agent-sessions@1
    config:
      resume: ["-s", "{{.SessionID}}"]
      continue: ["-c"]
      list: "opencode session list --format json | jq -r '.[].id'"

  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.config/opencode/skills

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: anomaly.context.md
