# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Anomaly sandbox
description: Anomaly opencode workload with the skills mixin, ready to run
author: Jared Davis
kind: set
version: "2.1.0"
args:
  registry:
    default: ghcr.io/jared-prime
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    description: Registry namespace the listed kits were pushed to
    buildArg: KIT_REGISTRY
  tag:
    default: dev
    pattern: '^[A-Za-z0-9_][A-Za-z0-9._-]*$'
    description: Tag the listed kits were pushed under
    buildArg: KIT_TAG
kits:
  - ref: ${{ kit.args.registry }}/workload/anomaly:${{ kit.args.tag }}
  - ref: ${{ kit.args.registry }}/skills:${{ kit.args.tag }}
