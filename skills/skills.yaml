# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Skills
description: Skills from this kit packaged as a complete mixin
author: Jared Davis
kind: mixin
dockerfile: skills.dockerfile
args:
  # included for build script compatibility; discarded in practice
  tools:
    default: ghcr.io/jared-prime/kit:latest
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    description: registry namespace for the base kit
    buildArg: tools

capabilities:
  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/kit/skills/introspection

  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/kit/skills/codebase-memory

  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/kit/skills/guided-review

  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/kit/skills/commit-message

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: skills.context.md
