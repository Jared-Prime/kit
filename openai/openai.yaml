# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Codex (OpenAI)
description: OpenAI Codex CLI as a sandbox workload preconfigured for GPT-6.1 Sol
author: Jared Davis

sourceUrl: https://github.com/openai/codex

kind: workload
provides:
  - codex@0.165.0
  - bash@5
  - codebase-memory-mcp@0.12.1
  - curl@8
  - git@2
  - jq@1
  - node@26.13
  - pnpm@12.15.0
  - prek@0.5.7
  - ripgrep@15
  - python@3.14
  - typescript@7.0.2
  - uv@0.13.6
dockerfile: openai.dockerfile
capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - hosts:
              - api.openai.com
              - auth.openai.com
              - chatgpt.com
              - api.githubcopilot.com
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - GET
              - HEAD

        deny:
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE
          - hosts:
              - api.github.com
            methods:
              - POST
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - POST
            paths:
              - "/**/git-receive-pack"

  - type: com.docker.sandbox/credential@1
    description: Credentials policy for the GitHub MCP server
    optional: true
    config:
      service: github
      phase: [runtime]
      apiKey:
        name: GITHUB_PAT_TOKEN
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/credential@1
    description: OpenAI access (API key or ChatGPT OAuth)
    optional: true
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: "Bearer %s"
      oauth:
        tokenEndpoint:
          host: auth.openai.com
          path: /oauth/token
        resourceHosts:
          - chatgpt.com
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command:
            - /usr/local/bin/authorization.sh
          user: agent
          env:
            - SBX_CRED_OPENAI_MODE
          description: Seed Codex auth mode from the host credential binding

  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.agents/skills

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: openai.context.md
