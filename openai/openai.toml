model = "gpt-6-sol"
web_search = "indexed"
personality = "pragmatic"
default_permissions = "workdir-net"
approval_policy = "on-request"
model_reasoning_effort = "medium"
forced_login_method = "chatgpt"

[features]
daemon_auto_start = false

[permissions.workdir-net]
extends = ":read-only"

[permissions.workdir-net.filesystem.":workspace_roots"]
"." = "write"

[permissions.workdir-net.network]
enabled = true

[tui]
alternate_screen = "never"

[[skills.config]]
path = "/home/agent/.agents/skills/guided-review/SKILL.md"
enabled = true
