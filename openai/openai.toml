model = "gpt-6.1-sol"
web_search = "indexed"
personality = "pragmatic"
default_permissions = "workdir-net"
approval_policy = "on-request"
model_reasoning_effort = "medium"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
http_headers = { "X-MCP-Readonly" = "true" }

[features]
daemon_auto_start = false

[permissions.workdir-net]
extends = ":read-only"

[permissions.workdir-net.filesystem]
"~/.cache" = "write"
":slash_tmp" = "write"

[permissions.workdir-net.filesystem.":workspace_roots"]
"." = "write"

[permissions.workdir-net.network]
enabled = true

[shell_environment_policy]
inherit = "core"
set = { PATH = "/opt/pnpm/bin:/opt/pnpm:/opt/uv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin", UV_PYTHON_INSTALL_DIR = "/opt/uv/python" }

[tui]
alternate_screen = "never"

[[skills.config]]
path = "/home/agent/.agents/skills/guided-review/SKILL.md"
enabled = true
