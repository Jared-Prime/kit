# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Tools Mixin
description: Various development tools as a mixin for Alpine workloads.
author: Jared Davis

kind: mixin
provides:
  - bash@5
  - codebase-memory-mcp@0.12.1
  - git@2
  - jq@1
  - node@26.12
  - pnpm@12.15.0
  - prek@0.5.7
  - python@3.14
  - typescript@7.0.2
  - uv@0.13.6
dockerfile: tools.dockerfile

capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: tools.context.md

  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/kit/skills/introspection

  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/kit/skills/codebase-memory
