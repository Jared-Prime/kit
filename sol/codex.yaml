# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Codex (Sol)
description: OpenAPI Codex CLI as a sandbox workload preconfigured for GPT-6 Sol
author: Jared Davis

sourceUrl: https://github.com/openai/codex

kind: workload
provides: ["codex@0.162.1"]
dockerfile: codex.dockerfile
capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - api.openai.com
          - auth.openai.com
          - chatgpt.com

  - type: com.docker.sandbox/credential@1
    config:
      service: openai
      phase: runtime
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts: [chatgpt.com]
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - user: agent
          command: |
            mkdir -p /home/agent/.codex
            printf '%s\n' '{"OPENAI_API_KEY":"proxy-managed"}' \
              > /home/agent/.codex/auth.json

  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.agents/skills
