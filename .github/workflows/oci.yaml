name: OCI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sandboxes-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  OCI_HOST: ghcr.io
  OCI_USER: jared-prime

jobs:
  # Per-commit prerelease of version.txt, e.g. 2.2.0-sha-9680438.
  # Workload FROM lines and sandbox.yaml refs resolve `:v<version>`, so the chain is tagged with it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(cat version.txt)-sha-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

  latest:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        architecture:
          - amd64
          - arm64
    steps:
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit:dev
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ github.ref != 'refs/heads/main' && format('{0}/{1}/kit:dev', env.OCI_HOST, env.OCI_USER) || '' }}
          outputs: ${{ github.ref == 'refs/heads/main' && format('type=image,name={0}/{1}/kit,push-by-digest=true,name-canonical=true,push=true', env.OCI_HOST, env.OCI_USER) || '' }}
          cache-from: type=gha,scope=kit-latest-${{ matrix.architecture }}
          cache-to: type=gha,scope=kit-latest-${{ matrix.architecture }},mode=max
      - name: Aqua Security Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.architecture }}
        with:
          scan-type: image
          image-ref: ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/kit@{2}', env.OCI_HOST, env.OCI_USER, steps.build.outputs.digest) || format('{0}/{1}/kit:dev', env.OCI_HOST, env.OCI_USER) }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Record digest
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-latest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  kit:
    needs: latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        architecture:
          - amd64
          - arm64
        kit:
          - claude
          - codex
          - opencode
    steps:
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/${{ matrix.kit }}:dev
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.kit }}
          platforms: linux/${{ matrix.architecture }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ github.ref != 'refs/heads/main' && format('{0}/{1}/kit/{2}:dev', env.OCI_HOST, env.OCI_USER, matrix.kit) || '' }}
          outputs: ${{ github.ref == 'refs/heads/main' && format('type=image,name={0}/{1}/kit/{2},push-by-digest=true,name-canonical=true,push=true', env.OCI_HOST, env.OCI_USER, matrix.kit) || '' }}
          cache-from: |
            type=gha,scope=kit-latest-${{ matrix.architecture }}
            type=gha,scope=kit-${{ matrix.kit }}-${{ matrix.architecture }}
          cache-to: type=gha,scope=kit-${{ matrix.kit }}-${{ matrix.architecture }},mode=max
      - name: Aqua Security Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.architecture }}
        with:
          scan-type: image
          image-ref: ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/kit/{2}@{3}', env.OCI_HOST, env.OCI_USER, matrix.kit, steps.build.outputs.digest) || format('{0}/{1}/kit/{2}:dev', env.OCI_HOST, env.OCI_USER, matrix.kit) }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Record digest
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-kit-${{ matrix.kit }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  push-latest:
    if: github.ref == 'refs/heads/main'
    needs: [version, latest, kit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-latest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit:dev
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("${OCI_HOST}/${OCI_USER}/kit@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${OCI_HOST}/${OCI_USER}/kit:dev" \
            -t "${OCI_HOST}/${OCI_USER}/kit:sha-${GITHUB_SHA}" \
            -t "${OCI_HOST}/${OCI_USER}/kit:v${VERSION}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${OCI_HOST}/${OCI_USER}/kit:dev"

  push-kit:
    if: github.ref == 'refs/heads/main'
    needs: [version, kit, push-latest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        kit:
          - claude
          - codex
          - opencode
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-kit-${{ matrix.kit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/${{ matrix.kit }}:dev
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("${OCI_HOST}/${OCI_USER}/kit/${{ matrix.kit }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${OCI_HOST}/${OCI_USER}/kit/${{ matrix.kit }}:dev" \
            -t "${OCI_HOST}/${OCI_USER}/kit/${{ matrix.kit }}:sha-${GITHUB_SHA}" \
            -t "${OCI_HOST}/${OCI_USER}/kit/${{ matrix.kit }}:v${VERSION}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${OCI_HOST}/${OCI_USER}/kit/${{ matrix.kit }}:dev"

  push-workload:
    if: github.ref == 'refs/heads/main'
    needs: [version, push-kit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        workload:
          - anomaly
          - anthropic
          - openai
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built from the kit descriptor so the frontend stages /usr/share/sandbox for the set
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/workload/${{ matrix.workload }}:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.workload }}
          file: ./${{ matrix.workload }}/${{ matrix.workload }}.yaml
          platforms: linux/amd64,linux/arm64
          build-args: |
            registry=${{ env.OCI_HOST }}/${{ env.OCI_USER }}
            version=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/workload/${{ matrix.workload }}:dev
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/workload/${{ matrix.workload }}:sha-${{ github.sha }}
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/workload/${{ matrix.workload }}:v${{ needs.version.outputs.version }}
          push: true
          cache-from: type=gha,scope=workload-${{ matrix.workload }}
          cache-to: type=gha,scope=workload-${{ matrix.workload }},mode=max

  push-sandbox:
    if: github.ref == 'refs/heads/main'
    needs: [version, push-workload, skills]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - workload: anomaly
            harness: opencode
          - workload: anthropic
            harness: claude
          - workload: openai
            harness: codex
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # sbx runs this set: the workload kit merged with the skills mixin
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/sandbox/${{ matrix.harness }}:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./sandbox.yaml
          platforms: linux/amd64,linux/arm64
          build-args: |
            registry=${{ env.OCI_HOST }}/${{ env.OCI_USER }}
            workload=${{ matrix.workload }}
            harness=${{ matrix.harness }}
            version=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/sandbox/${{ matrix.harness }}:dev
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/sandbox/${{ matrix.harness }}:sha-${{ github.sha }}
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/sandbox/${{ matrix.harness }}:v${{ needs.version.outputs.version }}
          push: true
          cache-from: type=gha,scope=sandbox-${{ matrix.harness }}
          cache-to: type=gha,scope=sandbox-${{ matrix.harness }},mode=max

  # The skills mixin is a scratch overlay of markdown and shell scripts.
  # It runs on pull requests too, so the kit frontend validates it before merge.
  skills:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/mixin/skills:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./skills
          file: ./skills/skills.yaml
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/mixin/skills:dev
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/mixin/skills:sha-${{ github.sha }}
            ${{ env.OCI_HOST }}/${{ env.OCI_USER }}/kit/mixin/skills:v${{ needs.version.outputs.version }}
          push: ${{ github.ref == 'refs/heads/main' }}
          outputs: ${{ github.ref != 'refs/heads/main' && 'type=cacheonly' || '' }}
          cache-from: type=gha,scope=skills
          cache-to: type=gha,scope=skills,mode=max
