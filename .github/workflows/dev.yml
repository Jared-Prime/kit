name: dev

on:
  push:
    branches: [main]

concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - kit: anomaly
            file: anomaly.yaml
          - kit: anthropic
            file: anthropic.yaml
          - kit: github
            file: github.yaml
          - kit: openai
            file: openai.yaml
          - kit: python
            file: python.yaml
          - kit: skills
            file: skills.yaml
          - kit: typescript
            file: typescript.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image namespace
        id: namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.kit }}
          file: ./${{ matrix.kit }}/${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/kit-${{ matrix.kit }}:dev

  harness:
    needs: kit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: claude
            kits: [anthropic, github, python, skills]
          - name: codex
            kits: [openai, github, python, skills]
          - name: opencode
            kits: [anomaly, github, python, skills]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set image namespace
        id: namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Find latest release version
        id: latest
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Generate kit set descriptor
        env:
          OWNER: ${{ steps.namespace.outputs.owner }}
          NAME: ${{ matrix.name }}
          KITS: ${{ join(matrix.kits, ' ') }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          {
            echo '# syntax=docker/sandbox-kit:3'
            echo 'schemaVersion: "3"'
            echo 'kind: set'
            echo "displayName: ${NAME} environment"
            echo "version: \"${LATEST_VERSION}-dev+${GITHUB_SHA:0:7}\""
            echo 'kits:'
            for kit in $KITS; do
              echo "  - ref: ghcr.io/${OWNER}/kit-${kit}:dev"
            done
          } | tee "${NAME}.generated.yaml"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.name }}.generated.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/harness-${{ matrix.name }}:dev
