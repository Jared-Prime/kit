name: dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - kit: anomaly
          - kit: anthropic
          - kit: openai
          - kit: skills
          - kit: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image namespace
        id: namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.kit }}
          file: ./${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.kit }}-kit:dev
          cache-from: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.kit }}-kit:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.kit }}-kit:buildcache,mode=max

  sandbox:
    needs: kit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: claude
            kits: [anthropic, tools, skills]
          - name: codex
            kits: [openai, tools, skills]
          - name: opencode
            kits: [anomaly, tools, skills]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set image namespace
        id: namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Find latest release version
        id: latest
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Generate kit set descriptor
        env:
          OWNER: ${{ steps.namespace.outputs.owner }}
          NAME: ${{ matrix.name }}
          KITS: ${{ join(matrix.kits, ' ') }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          {
            echo '# syntax=docker/sandbox-kit:3'
            echo 'schemaVersion: "3"'
            echo 'kind: set'
            echo "displayName: ${NAME} environment"
            echo "version: \"${LATEST_VERSION}\""
            echo 'kits:'
            for kit in $KITS; do
              echo "  - ref: ghcr.io/${OWNER}/${kit}-kit:dev"
            done
          } | tee "${NAME}.generated.yaml"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.name }}.generated.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.name }}-sandbox:dev
          cache-from: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.name }}-sandbox:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.name }}-sandbox:buildcache,mode=max
