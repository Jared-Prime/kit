name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
          package_json_file: typescript/utility/package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.12"
          cache: pnpm
          cache-dependency-path: typescript/utility/pnpm-lock.yaml
      - name: Install typescript/utility dependencies
        run: pnpm --dir typescript/utility install --frozen-lockfile
      - name: Test Codex log collector
        run: pnpm --dir typescript/utility run codex:test
      - name: prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
      - name: Aqua Security Trivy (repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - anomaly
          - anthropic
          - github
          - openai
          - python
          - skills
          - typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build kit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.kit }}
          file: ./${{ matrix.kit }}/${{ matrix.kit }}.dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kit-${{ matrix.kit }}:scan
          cache-from: type=gha,scope=scan-${{ matrix.kit }}
          cache-to: type=gha,scope=scan-${{ matrix.kit }},mode=max
      - name: Aqua Security Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kit-${{ matrix.kit }}:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
