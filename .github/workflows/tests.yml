name: unit test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run guided-review tests
        run: python -B -m unittest discover -s .tests -v
