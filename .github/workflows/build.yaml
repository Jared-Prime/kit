name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io/jared-prime
  SHA: ${{ github.sha }}

jobs:
  prek:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  tools:
    needs:
      - prek
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.REGISTRY }}/kit:${{ env.SHA }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/kit:${{ env.SHA }}
            ${{ env.REGISTRY }}/kit:latest
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max

  skills:
    needs:
      - prek
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.REGISTRY }}/kit/skills:${{ env.SHA }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./skills
          file: ./skills/skills.yaml
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/kit/skills:${{ env.SHA }}
            ${{ env.REGISTRY }}/kit/skills:latest
          cache-from: type=gha,scope=skills
          cache-to: type=gha,scope=skills,mode=max

  workload:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - prek
      - tools
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      matrix:
        name:
          - anomaly
          - anthropic
          - openai
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.REGISTRY }}/kit/workload/${{ matrix.name }}:${{ env.SHA }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.name }}
          file: ./${{ matrix.name }}/${{ matrix.name }}.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/kit/workload/${{ matrix.name }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/kit/workload/${{ matrix.name }}:latest
          build-args: |
            tools=${{ env.REGISTRY }}/kit:${{ env.SHA }}
          cache-from: type=gha,scope=workload-${{ matrix.name }}
          cache-to: type=gha,scope=workload-${{ matrix.name }},mode=max
