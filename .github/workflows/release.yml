name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Promotes the images the OCI workflow already built and scanned for this commit.
  # Nothing is rebuilt: `latest` and the release tag are attached to the same digests.
  promote:
    needs:
      - release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      OCI_HOST: ghcr.io
      OCI_USER: jared-prime
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Wait for the OCI workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow oci.yaml --commit "${GITHUB_SHA}" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "${run_id}" ] && break
            sleep 10
          done
          test -n "${run_id}" || { echo "no OCI run found for ${GITHUB_SHA}" >&2; exit 1; }
          gh run watch "${run_id}" --interval 30 --exit-status
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote ${{ env.TAG }} and latest
        run: |
          for image in \
            kit kit/claude kit/codex kit/opencode \
            workload/anomaly workload/anthropic workload/openai \
            sandbox/anomaly sandbox/anthropic sandbox/openai \
            skills; do
            repo="${OCI_HOST}/${OCI_USER}/${image}"
            docker buildx imagetools create \
              -t "${repo}:latest" \
              -t "${repo}:${TAG}" \
              "${repo}:sha-${GITHUB_SHA}"
            docker buildx imagetools inspect "${repo}:${TAG}"
          done
