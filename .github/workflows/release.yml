name: release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - buildx
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io/jared-prime
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions: {}

jobs:
  release:
    # a build for an older commit can finish after main has moved on (e.g. the release PR merged);
    # skip it so release-please and the sandbox images always see the same commit
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha)
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
