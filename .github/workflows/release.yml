name: release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io/jared-prime
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions: {}

jobs:
  release:
    # a build for an older commit can finish after main has moved on (e.g. the release PR merged);
    # skip it so release-please and the sandbox images always see the same commit
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha)
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  cloud:
    needs:
      - release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        workload:
          - anomaly
          - anthropic
          - openai
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.REGISTRY }}/kit/cloud/${{ matrix.workload }}:${{ env.SHA }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud.yaml
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.release.outputs.release_created == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/kit/cloud/${{ matrix.workload }}:latest
            ${{ needs.release.outputs.version && format('{0}/kit/cloud/{1}:{2}', env.REGISTRY, matrix.workload, needs.release.outputs.version) || '' }}
            ${{ env.REGISTRY }}/kit/cloud/${{ matrix.workload }}:${{ env.SHA }}
          build-args: |
            registry=${{ env.REGISTRY }}
            workload=${{ matrix.workload }}
            ${{ needs.release.outputs.version && format('version={0}', needs.release.outputs.version) || 'version=0.0.0' }}
            tag=${{ env.SHA }}
          cache-from: type=gha,scope=cloud-${{ matrix.workload }}
          cache-to: type=gha,scope=cloud-${{ matrix.workload }},mode=max

  sandbox:
    needs:
      - release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload:
          - anomaly
          - anthropic
          - openai
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.REGISTRY }}/kit/sandbox/${{ matrix.workload }}:${{ env.SHA }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sandbox.yaml
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.release.outputs.release_created == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/kit/sandbox/${{ matrix.workload }}:latest
            ${{ needs.release.outputs.version && format('{0}/kit/sandbox/{1}:{2}', env.REGISTRY, matrix.workload, needs.release.outputs.version) || '' }}
            ${{ env.REGISTRY }}/kit/sandbox/${{ matrix.workload }}:${{ env.SHA }}
          build-args: |
            registry=${{ env.REGISTRY }}
            workload=${{ matrix.workload }}
            ${{ needs.release.outputs.version && format('version={0}', needs.release.outputs.version) || 'version=0.0.0' }}
            tag=${{ env.SHA }}
          cache-from: type=gha,scope=sandbox-${{ matrix.workload }}
          cache-to: type=gha,scope=sandbox-${{ matrix.workload }},mode=max

  # report-only: images are already published, so findings do not fail the release
  scan:
    needs:
      - release
      - sandbox
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload:
          - anomaly
          - anthropic
          - openai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Trivy scan
        env:
          WORKLOAD: ${{ matrix.workload }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v "$GITHUB_WORKSPACE/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image \
            --image-src remote \
            --ignorefile /.trivyignore \
            --ignore-unfixed --no-progress \
            --severity HIGH,CRITICAL --format table \
            "$REGISTRY/kit/sandbox/$WORKLOAD:$SHA"

  # detects, but does not prevent, a split release (some images published, others not)
  verify:
    needs:
      - release
      - sandbox
    if: always() && needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify version and latest tags match
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          set -uo pipefail
          fail=0
          for w in anomaly anthropic openai; do
            image="$REGISTRY/kit/sandbox/$w"
            versioned=$(docker buildx imagetools inspect "$image:$V" --format '{{.Manifest.Digest}}') || {
              echo "::error::missing image $image:$V"
              fail=1
              versioned=
            }
            latest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}') || {
              echo "::error::missing image $image:latest"
              fail=1
              latest=
            }
            if [ -n "$versioned" ] && [ -n "$latest" ] && [ "$versioned" != "$latest" ]; then
              echo "::error::$image:$V ($versioned) and :latest ($latest) differ"
              fail=1
            fi
          done
          exit "$fail"
