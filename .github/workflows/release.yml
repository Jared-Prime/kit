name: release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io/jared-prime
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions: {}

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  sandbox:
    needs:
      - release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - workload: anomaly
            harness: opencode
          - workload: anthropic
            harness: claude
          - workload: openai
            harness: codex
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ${{ env.REGISTRY }}/kit/sandbox/${{ matrix.harness }}:${{ env.SHA }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.workload }}
          file: ./${{ matrix.workload }}/${{ matrix.harness }}.yaml
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.release.outputs.release_created == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/kit/sandbox/${{ matrix.harness }}:latest
            ${{ needs.release.outputs.version && format('{0}/kit/sandbox/{1}:{2}', env.REGISTRY, matrix.harness, needs.release.outputs.version) || '' }}
            ${{ env.REGISTRY }}/kit/sandbox/${{ matrix.harness }}:${{ env.SHA }}
          build-args: |
            registry=${{ env.REGISTRY }}
            ${{ needs.release.outputs.version && format('version={0}', needs.release.outputs.version) || 'version=0.0.0' }}
            tag=${{ env.SHA }}
          cache-from: type=gha,scope=sandbox-${{ matrix.harness }}
          cache-to: type=gha,scope=sandbox-${{ matrix.harness }},mode=max
