name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  kit:
    needs:
      - release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - kit: anomaly
          - kit: anthropic
          - kit: openai
          - kit: skills
          - kit: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Set image namespace
        id: namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.kit }}
          file: ./${{ matrix.kit }}/${{ matrix.kit }}.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.kit }}-kit:${{ needs.release.outputs.tag_name }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.kit }}-kit:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.kit }}-kit:buildcache,mode=max

  harness:
    needs:
      - release
      - kit
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: claude
            kits: [anthropic, tools, skills]
          - name: codex
            kits: [openai, tools, skills]
          - name: opencode
            kits: [anomaly, tools, skills]
    steps:
      - name: Set image namespace
        id: namespace
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Generate kit set descriptor
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          OWNER: ${{ steps.namespace.outputs.owner }}
          NAME: ${{ matrix.name }}
          KITS: ${{ join(matrix.kits, ' ') }}
        run: |
          {
            echo '# syntax=docker/sandbox-kit:3'
            echo 'schemaVersion: "3"'
            echo 'kind: set'
            echo "displayName: ${NAME} environment"
            echo "version: \"${TAG#v}\""
            echo 'kits:'
            for kit in $KITS; do
              echo "  - ref: ghcr.io/${OWNER}/kit-${kit}:${TAG}"
            done
          } | tee "${NAME}.generated.yaml"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.name }}.generated.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.name }}-sandbox:${{ needs.release.outputs.tag_name }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.name }}-sandbox:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.name }}-sandbox:buildcache,mode=max
