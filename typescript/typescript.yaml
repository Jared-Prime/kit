# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: TypeScript toolchain
description: Node.js, pnpm, and the TypeScript compiler as a mixin, scoped to npm registry access
author: Jared Davis

kind: mixin
provides: ["node@24", "pnpm@10.15.0", "typescript@5.9.2"]
dockerfile: typescript.dockerfile

capabilities:
  - type: com.docker.sandbox/network-policy@2
    description: Network policy for read access to the npm registry
    config:
      runtime:
        allow:
          - hosts:
              - registry.npmjs.org
            methods:
              - GET
              - HEAD

        deny:
          - hosts:
              - registry.npmjs.org
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: typescript.context.md
