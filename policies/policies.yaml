# syntax=docker/sandbox-kit:3

schemaVersion: "3"
displayName: Sandbox Policies
description: Fine-grained sandbox policies for improved safety

kind: mixin
dockerfile: policies.dockerfile
capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: policies.context.md

  - type: com.docker.sandbox/network-policy@2
    optional: false
    config:
      runtime:
        allow:
          # host network access to LM Studio
          - hosts:
              - localhost:1234
          # read-only model provider apis
          - hosts:
              - auth.openai.com
              - chatgpt.com
              - claude.ai
              - platform.claude.com
            methods:
              - GET
              - HEAD
          # mutable model provider apis
          - hosts:
              - platform.claude.com
            methods:
              - POST
            paths:
              - /v1/oauth/token
          - hosts:
              - chatgpt.com
            methods:
              - POST
            paths:
              - /backend-api/codex/responses
          # read-only GitHub api
          - hosts:
              - github.com
              - api.github.com
            methods:
              - GET
              - HEAD
          # read-only software package registries
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - GET
              - HEAD

        deny:
          - hosts:
              - github.com
            methods:
              - PATCH
              - PUT
              - DELETE
          - hosts:
              - github.com
            methods:
              - POST
            paths:
              - "/**/git-receive-pack"
          - hosts:
              - api.github.com
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE
          - hosts:
              - registry.npmjs.org
              - pypi.org
              - files.pythonhosted.org
            methods:
              - PATCH
              - POST
              - PUT
              - DELETE
